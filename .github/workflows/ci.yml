name: CI

on:
  push:
    branches: ["master", "main"]
  pull_request:
    branches: ["master", "main"]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: clang-format check
        run: |
          find include src tests -name '*.cpp' -o -name '*.hpp' | \
            xargs clang-format --dry-run --Werror

  build-and-test:
    name: Build & test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Qt (Linux)
        if: runner.os == 'Linux'
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.0"
          modules: "qtquickcontrols2 qtmultimedia qtsvg"
          cache: true

      - name: Install Qt (macOS)
        if: runner.os == 'macOS'
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.0"
          modules: "qtquickcontrols2 qtmultimedia qtsvg"
          cache: true

      - name: Install Qt (Windows)
        if: runner.os == 'Windows'
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.0"
          modules: "qtquickcontrols2 qtmultimedia qtsvg"
          cache: true

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libegl1 \
            libxkbcommon-x11-0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-randr0 \
            libxcb-render-util0 \
            libxcb-xinerama0 \
            libxcb-xfixes0 \
            libxcb-shape0 \
            libxcb-cursor0 \
            libgl1-mesa-dev \
            libglib2.0-0 \
            libdbus-1-3 \
            libfontconfig1 \
            libpulse0

      - name: Configure
        run: cmake --preset ci

      - name: Build (Linux/macOS)
        if: runner.os != 'Windows'
        run: cmake --build --preset ci

      - name: Build (Windows)
        if: runner.os == 'Windows'
        run: cmake --build --preset ci --config Debug

      - name: Test (Linux/macOS)
        if: runner.os != 'Windows'
        run: ctest --preset ci --output-on-failure

      - name: Test (Windows)
        if: runner.os == 'Windows'
        run: ctest --preset ci -C Debug --output-on-failure
